name = "ordax-control-plane-v3"
main = "src/index.ts"
compatibility_date = "2026-09-27"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[observability]
enabled = true
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = true

[triggers]
crons = ["17 3 * * *"]

[vars]
PRODUCT_AUTH_ISSUER = "https://jhfphsjptrpmtnzkpwud.supabase.co/auth/v1"
PRODUCT_AUTH_AUDIENCE = "authenticated"
PRODUCT_AUTH_JWKS_URL = "https://jhfphsjptrpmtnzkpwud.supabase.co/auth/v1/.well-known/jwks.json"

[[d1_databases]]
binding = "DB"
database_name = "ordax-control-plane-v3"
database_id = "ac121be2-0459-47f9-abb7-1033c60c52c0"
migrations_dir = "migrations"

[[hyperdrive]]
binding = "POSTGRES"
id = "4b601ec5815f43259bd8040053825d2a"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "ordax-device-artifacts"

[[durable_objects.bindings]]
name = "DEVICE_SESSIONS"
class_name = "DeviceSession"

[[durable_objects.bindings]]
name = "ENROLLMENT_SESSIONS"
class_name = "EnrollmentSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeviceSession"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["EnrollmentSession"]
