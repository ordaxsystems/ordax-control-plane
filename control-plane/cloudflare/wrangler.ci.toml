name = "ordax-control-plane-v3-ci"
main = "src/index.ts"
compatibility_date = "2026-09-27"
workers_dev = true

[triggers]
crons = ["17 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "ordax-control-plane-v3-ci"
database_id = "00000000000000000000000000000000"

[[hyperdrive]]
binding = "POSTGRES"
id = "00000000000000000000000000000000"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "ordax-device-artifacts-ci"

[[durable_objects.bindings]]
name = "DEVICE_SESSIONS"
class_name = "DeviceSession"

[[durable_objects.bindings]]
name = "ENROLLMENT_SESSIONS"
class_name = "EnrollmentSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeviceSession"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["EnrollmentSession"]
