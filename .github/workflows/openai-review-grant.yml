name: Provision OpenAI Review Grant

on:
  workflow_dispatch:
    inputs:
      link_id:
        description: "ORDAX Product device-link UUID created by the dedicated review account"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ordax-openai-review-grant
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cloudflare-v3
    env:
      CONTROL_PLANE_URL: https://ordax-control-plane-v3.ordax-ac1ca1b50d09.workers.dev
      ORDAX_OPERATOR_TOKEN: ${{ secrets.ORDAX_OPERATOR_TOKEN }}
      REVIEW_LINK_ID: ${{ inputs.link_id }}
    steps:
      - name: Validate inputs and secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORDAX_OPERATOR_TOKEN" || { echo "Missing ORDAX_OPERATOR_TOKEN"; exit 1; }
          python - <<'PY'
          import os
          import uuid

          raw = os.environ["REVIEW_LINK_ID"].strip()
          parsed = uuid.UUID(raw)
          if str(parsed) != raw.lower():
              raise SystemExit("link_id must be a canonical UUID")
          print("Review link id is structurally valid")
          PY

      - name: Create least-privilege review grants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timedelta, timezone

          base = os.environ["CONTROL_PLANE_URL"].rstrip("/")
          token = os.environ["ORDAX_OPERATOR_TOKEN"]
          link_id = os.environ["REVIEW_LINK_ID"].strip().lower()

          device_actions = [
              "computer.access_status",
              "computer.active_window",
              "computer.click",
              "computer.focus_window",
              "computer.launch_app",
              "computer.mouse_move",
              "computer.processes",
              "computer.screen_info",
              "computer.screenshot",
              "computer.scroll",
              "computer.type",
              "computer.windows",
          ]
          project_actions = [
              "git.status",
              "projects.list",
              "workspace.repository_catalog",
              "project.search_text",
              "project.text_read",
              "project.text_write",
          ]
          forbidden_actions = {
              "computer.hotkey",
              "computer.terminate_process",
              "git.command",
              "process.start",
              "process.stop",
              "terminal.exec",
          }
          granted_actions = set(device_actions) | set(project_actions)
          escaped = sorted(forbidden_actions.intersection(granted_actions))
          if escaped:
              raise SystemExit(f"forbidden review action(s): {escaped!r}")

          expires_at = (datetime.now(timezone.utc) + timedelta(days=30)).isoformat()
          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "Accept": "application/json",
              "User-Agent": "ORDAX-OpenAI-Review-Provisioner/1.0 (+https://github.com/washingtonmsdj/ordax-control-plane)",
          }

          def create_grant(actions: list[str], projects: list[str], label: str) -> dict:
              payload = json.dumps(
                  {
                      "link_id": link_id,
                      "actions": actions,
                      "projects": projects,
                      "expires_at": expires_at,
                  },
                  separators=(",", ":"),
              ).encode("utf-8")
              request = urllib.request.Request(
                  f"{base}/v3/product-grants/from-link",
                  data=payload,
                  method="POST",
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      raw = response.read(1_048_577)
                      status = response.status
              except urllib.error.HTTPError as error:
                  raw_error = error.read(4096).decode("utf-8", "replace")
                  raise SystemExit(
                      f"{label} review grant API failed with HTTP {error.code}: {raw_error}"
                  )
              if len(raw) > 1_048_576:
                  raise SystemExit(f"{label} review grant response exceeded 1 MiB")
              body = json.loads(raw)
              if status != 201 or body.get("ok") is not True:
                  raise SystemExit(
                      f"unexpected {label} review grant response: status={status}"
                  )

              grant = body.get("grant") or {}
              provenance = body.get("provenance") or {}
              if provenance.get("link_id") != link_id:
                  raise SystemExit(f"{label} review grant provenance link mismatch")
              if grant.get("projects") != sorted(projects):
                  raise SystemExit(
                      f"{label} review grant project scope mismatch: {grant.get('projects')!r}"
                  )
              if grant.get("actions") != sorted(actions):
                  raise SystemExit(
                      f"{label} review grant action mismatch: {grant.get('actions')!r}"
                  )
              if not grant.get("id") or not grant.get("device_id"):
                  raise SystemExit(f"{label} review grant is missing id/device provenance")
              return grant

          device_grant = create_grant(device_actions, [], "device")
          project_grant = create_grant(
              project_actions,
              ["ordax-review-demo"],
              "project",
          )
          if device_grant["device_id"] != project_grant["device_id"]:
              raise SystemExit("review grants resolved to different devices")
          if device_grant.get("subject_id") != project_grant.get("subject_id"):
              raise SystemExit("review grants resolved to different subjects")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("## ORDAX OpenAI review grants\n\n")
                  handle.write(f"- Device grant: `{device_grant['id']}`\n")
                  handle.write(f"- Project grant: `{project_grant['id']}`\n")
                  handle.write(f"- Device: `{device_grant['device_id']}`\n")
                  handle.write("- Device scope: **bounded Computer Control only**\n")
                  handle.write("- Project scope: `ordax-review-demo` only, including bounded project/repository discovery\n")
                  handle.write("- Shell / hotkey / process termination: **not granted**\n")
                  handle.write(f"- Expires: `{device_grant.get('expires_at')}`\n")
          print("Least-privilege ORDAX review grants created")
          PY
