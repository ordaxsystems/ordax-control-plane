name: ORDAX Control Plane CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  connector-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate connector package contract
        run: python -m unittest tests.test_ordax_studio_plugin_package
      - name: Build deterministic ChatGPT connector
        run: |
          python scripts/build_ordax_plugin.py --output-dir dist/plugins
          test "$(find dist/plugins -maxdepth 1 -name 'ordax-chatgpt-plugin-*.zip' | wc -l)" -eq 1

  control-plane-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Control Plane contract tests
        run: |
          node --test control-plane/tests/product_mcp_results.test.mts
          python -m unittest tests.test_product_action_scope_contract tests.test_cloudflare_device_scope_wiring tests.test_owner_device_computer_grants_contract tests.test_owner_device_intelligence_grants_contract tests.test_mcp_owner_grant_hint_contract tests.test_product_readonly_worker_contract tests.test_product_auth_contract tests.test_product_device_pairing_contract tests.test_product_link_aware_grants tests.test_openai_plugin_annotation_evidence tests.test_openai_review_grant_workflow tests.test_cloudflare_account_resolution tests.test_secure_secret_cutover_script

      - name: Verify canonical MCP surface revision exists
        run: |
          grep -q 'MCP_TOOL_SURFACE_REVISION = "2026-10-06.2"' control-plane/cloudflare/src/mcp_http.ts
          test -f control-plane/cloudflare/src/index.ts
          test -f control-plane/cloudflare/migrations/0008_product_device_owner.sql

