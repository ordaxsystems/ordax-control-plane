name: Deploy Cloudflare v3 Control Plane

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Bridge CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: cloudflare-v3-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-v3
    steps:
      - name: Validate required secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ORDAX_OPERATOR_TOKEN: ${{ secrets.ORDAX_OPERATOR_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$ORDAX_OPERATOR_TOKEN" || { echo "Missing ORDAX_OPERATOR_TOKEN"; exit 1; }

      - name: Checkout verified main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install Device Agent package
        run: python -m pip install --disable-pip-version-check -e .

      - name: Provision and deploy
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ORDAX_OPERATOR_TOKEN: ${{ secrets.ORDAX_OPERATOR_TOKEN }}
          PRODUCT_AUTH_ISSUER: https://eobcxuyvhkvdmkbaihwh.supabase.co/auth/v1
          PRODUCT_AUTH_AUDIENCE: authenticated
          PRODUCT_AUTH_JWKS_URL: https://eobcxuyvhkvdmkbaihwh.supabase.co/auth/v1/.well-known/jwks.json
        run: bash scripts/cloudflare/deploy-v3.sh

      - name: Wait for public health
        shell: bash
        env:
          CONTROL_PLANE_URL: ${{ steps.deploy.outputs.control_plane_url }}
        run: |
          test -n "$CONTROL_PLANE_URL" || { echo "Deploy did not expose control-plane URL"; exit 1; }
          for attempt in $(seq 1 60); do
            if health="$(curl --fail --silent --show-error "$CONTROL_PLANE_URL/health")"; then
              if python -c 'import json,sys; data=json.load(sys.stdin); raise SystemExit(0 if data.get("service") == "ordax-control-plane-v3" and data.get("product_auth_configured") is True else 1)' <<<"$health"; then
                echo "Remote health + Product auth OK: $CONTROL_PLANE_URL"
                exit 0
              fi
            fi
            sleep 2
          done
          echo "Remote health/Product auth did not become ready: $CONTROL_PLANE_URL"
          exit 1

      - name: Verify remote Cloudflare v3 end to end
        shell: bash
        env:
          CONTROL_PLANE_URL: ${{ steps.deploy.outputs.control_plane_url }}
          ORDAX_OPERATOR_TOKEN: ${{ secrets.ORDAX_OPERATOR_TOKEN }}
        run: |
          python scripts/verify_cloudflare_v3.py \
            --base-url "$CONTROL_PLANE_URL" \
            --operator-token "$ORDAX_OPERATOR_TOKEN"

      - name: Record verified endpoint
        shell: bash
        env:
          CONTROL_PLANE_URL: ${{ steps.deploy.outputs.control_plane_url }}
        run: |
          {
            echo "## Cloudflare v3 verified"
            echo
            echo "Control plane: `$CONTROL_PLANE_URL`"
            echo
            echo "Health, Product JWT/JWKS readiness, WebSocket job delivery, lease, D1 persistence and R2 round-trip passed."
          } >> "$GITHUB_STEP_SUMMARY"
