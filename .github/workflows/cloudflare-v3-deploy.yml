name: Deploy ORDAX Control Plane

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - ORDAX Control Plane CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: ordax-control-plane-production
  cancel-in-progress: false

jobs:
  foundation:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      account_id: ${{ steps.foundation.outputs.account_id }}
      deployment_ready: ${{ steps.foundation.outputs.deployment_ready }}
    steps:
      - name: Checkout exact successful source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Validate canonical Cloudflare production foundation
        id: foundation
        shell: bash
        run: |
          python scripts/cloudflare/check_deploy_readiness.py --allow-blocked --github-output "$GITHUB_OUTPUT"

  deploy:
    needs: foundation
    if: ${{ needs.foundation.result == 'success' && needs.foundation.outputs.deployment_ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-v3
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ needs.foundation.outputs.account_id }}
    steps:
      - name: Checkout exact successful source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Record deploy source
        shell: bash
        run: |
          echo "ORDAX_DEPLOY_SOURCE_SHA=$(git rev-parse HEAD)"
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}"
          fi

      - name: Install pinned Worker runtime dependency
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false --prefix control-plane/cloudflare

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate deploy credential
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if ! test -n "$CLOUDFLARE_API_TOKEN"; then
            echo "::error::Set CLOUDFLARE_API_TOKEN in the cloudflare-v3 GitHub environment with least-privilege deployment authority for the dedicated OrdaX account. No deployment was attempted."
            exit 1
          fi

      - name: Deploy existing Worker
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash scripts/cloudflare/deploy-production-v3.sh

      - name: Install public smoke dependencies
        run: python -m pip install --disable-pip-version-check "httpx>=0.26,<1"

      - name: Verify public health and OAuth contract
        env:
          CONTROL_PLANE_URL: ${{ steps.deploy.outputs.control_plane_url }}
        run: python scripts/verify_cloudflare_public.py --base-url "$CONTROL_PLANE_URL"
