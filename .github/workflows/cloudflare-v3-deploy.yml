name: Deploy ORDAX Control Plane

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ordax-control-plane-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-v3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate required secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ORDAX_OPERATOR_TOKEN: ${{ secrets.ORDAX_OPERATOR_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$ORDAX_OPERATOR_TOKEN"

      - name: Install E2E Runtime client at pinned source
        run: |
          python -m pip install --disable-pip-version-check "git+https://github.com/washingtonmsdj/ordax-runtime.git@903dbbbe8b4d51fb352d8d2f59d0a0ff32688d47"

      - name: Provision and deploy
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ORDAX_OPERATOR_TOKEN: ${{ secrets.ORDAX_OPERATOR_TOKEN }}
          PRODUCT_AUTH_ISSUER: https://eobcxuyvhkvdmkbaihwh.supabase.co/auth/v1
          PRODUCT_AUTH_AUDIENCE: authenticated
          PRODUCT_AUTH_JWKS_URL: https://eobcxuyvhkvdmkbaihwh.supabase.co/auth/v1/.well-known/jwks.json
        run: bash scripts/cloudflare/deploy-v3.sh

      - name: Wait for public health
        shell: bash
        env:
          CONTROL_PLANE_URL: ${{ steps.deploy.outputs.control_plane_url }}
        run: |
          test -n "$CONTROL_PLANE_URL"
          for attempt in $(seq 1 60); do
            if health="$(curl --fail --silent --show-error "$CONTROL_PLANE_URL/health")"; then
              if python -c 'import json,sys; d=json.load(sys.stdin); raise SystemExit(0 if d.get("service")=="ordax-control-plane-v3" and d.get("product_auth_configured") is True else 1)' <<<"$health"; then
                exit 0
              fi
            fi
            sleep 2
          done
          exit 1

      - name: Verify remote Control Plane end to end
        shell: bash
        env:
          CONTROL_PLANE_URL: ${{ steps.deploy.outputs.control_plane_url }}
          ORDAX_OPERATOR_TOKEN: ${{ secrets.ORDAX_OPERATOR_TOKEN }}
        run: python scripts/verify_cloudflare_v3.py --base-url "$CONTROL_PLANE_URL" --operator-token "$ORDAX_OPERATOR_TOKEN"
