name: ORDAX Control Plane Release Handoff

on:
  push:
    branches:
      - ci/worker-bundle-artifact

permissions:
  contents: write

jobs:
  export:
    if: ${{ !contains(github.event.head_commit.message, '[release-handoff]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/worker-bundle-artifact
      - name: Build exact Worker content
        run: |
          outdir="$RUNNER_TEMP/ordax-control-plane-worker"
          rm -rf "$outdir"
          npx --yes wrangler@4.141.0 deploy --dry-run --cwd control-plane/cloudflare --outdir "$outdir"
          test -f "$outdir/index.js"
          grep -q 'app_intelligence_catalog' "$outdir/index.js"
          grep -q 'app_intelligence_detail' "$outdir/index.js"
          mkdir -p .ordax-release
          cp "$outdir/index.js" .ordax-release/worker.js
          sha256sum .ordax-release/worker.js | awk '{print $1}' > .ordax-release/worker.sha256
          printf '%s\n' "$GITHUB_SHA" > .ordax-release/source.sha
      - name: Publish ephemeral release handoff on this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ordax-release/worker.js .ordax-release/worker.sha256 .ordax-release/source.sha
          git commit -m "chore: export Control Plane release handoff [release-handoff]"
          git push origin HEAD:ci/worker-bundle-artifact
